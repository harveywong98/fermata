<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fermata · 知识资料</title>
<style>
body{font:15px/1.6 system-ui;margin:32px auto;max-width:1150px;padding:0 20px;color:#243044;background:#f6f7f9}h1{font-size:25px}h2{font-size:18px}button,input{font:inherit;padding:7px 10px;margin:4px;border:1px solid #ccd3df;border-radius:5px}button{cursor:pointer;background:white}button:disabled{opacity:.45;cursor:wait}.layout{display:grid;grid-template-columns:260px 1fr;gap:20px}.panel{background:white;padding:20px;border-radius:9px;border:1px solid #e1e5eb}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.6 system-ui;background:#f7f8fa;padding:12px;max-height:320px;overflow:auto}.steps{display:flex;gap:15px;color:#667085;margin-bottom:15px}.active{color:#205ac8;font-weight:600}#message{min-height:26px;color:#205ac8}small{color:#667085}details{border-top:1px solid #eee;padding:10px 0}.file{display:block;width:100%;text-align:left;overflow-wrap:anywhere}#result article{border-top:1px solid #ddd;padding:12px 0}@media(max-width:700px){.layout{grid-template-columns:1fr}}
</style>
<h1>Fermata · 知识资料</h1><p>上传、预览和删块只保存临时草稿；最终确认后才写入数据库。</p><div id="message" role="status"></div>
<div class="layout"><aside class="panel"><h2>文件列表</h2><button onclick="act(refresh)">刷新</button><div id="files"></div><h2>未确认草稿</h2><small>仅临时文件，尚未入库</small><div id="drafts"></div></aside>
<main class="panel"><div class="steps"><span id="step1" class="active">1 上传</span><span id="step2">2 解析与设置</span><span id="step3">3 分块与入库</span></div>
<label>业务知识库 <input id="kb" value="电力" size="12"></label><input id="file" type="file" accept=".pdf,.docx,.xlsx,.txt,.md"><button onclick="act(upload)">上传并解析</button>
<section id="editor" hidden><h2 id="filename"></h2><details><summary>当前草稿内容</summary><div id="parsed"></div></details>
<label>完整输入预算 <input id="size" type="number" value="400" min="128" max="480" style="width:70px"></label>
<label>正文重叠 <input id="overlap" type="number" value="40" min="0" max="80" style="width:60px"></label>
<button onclick="act(preview)">生成 / 重新生成预览</button><small>单位：tokens；包含标题、表头。表格不重复相邻行。</small>
<h2 id="chunkTitle">分块预览</h2><small>删除会从父单元移除对应正文并重新切块；调整大小不会恢复已删除内容。全部删空后确认入库，会清空该文档已发布的检索内容。原文件保留。</small><div id="chunks"></div><button id="publish" onclick="act(publish)">确认入库</button><button onclick="act(discardDraft)">放弃草稿</button><button onclick="act(remove)">删除已入库文档</button></section>
<h2>检索验证</h2><input id="query" placeholder="描述你要查的业务信息" style="width:65%"><button onclick="act(search)">搜索</button><small>使用上方业务知识库；命中子块后返回父单元。</small><div id="result"></div>
</main></div>
<script>
let current=null,busy=false;const el=id=>document.getElementById(id),esc=s=>{let x=document.createElement('span');x.textContent=s??'';return x.innerHTML};
async function api(path,options={}){const r=await fetch('/api'+path,options);const data=await r.json();if(!r.ok)throw Error(typeof data.detail==='string'?data.detail:JSON.stringify(data.detail));return data}
const post=(path,body)=>api(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
async function act(fn){if(busy)return;busy=true;document.querySelectorAll('button').forEach(b=>b.disabled=true);el('message').textContent='处理中…';try{await fn();el('message').textContent='完成'}catch(e){el('message').textContent=e.message}finally{busy=false;document.querySelectorAll('button').forEach(b=>b.disabled=false);el('publish').disabled=!current?.document.processing_config.preview_id}}
async function refresh(){const docs=await api('/documents');el('files').innerHTML=docs.map(d=>`<button class="file" onclick="act(()=>openDoc(${d.id}))">${esc(d.file_name)}<br><small>${esc(d.knowledge_base_id)} · 已入库</small></button>`).join('');const ds=await api('/drafts');el('drafts').innerHTML=ds.map(d=>`<button class="file" onclick="act(()=>openDraft('${d.draft_id}'))">${esc(d.file_name)}</button>`).join('')}
async function openDoc(id){const d=await post(`/documents/${id}/draft`,{});await openDraft(d.draft_id);await refresh()}
async function openDraft(id){current=await api('/drafts/'+id);const d=current.document;el('editor').hidden=false;el('filename').textContent=d.file_name;el('kb').value=d.knowledge_base_id;el('size').value=d.processing_config.size||400;el('overlap').value=d.processing_config.overlap??40;el('parsed').innerHTML=current.parsed.map(p=>`<strong>${esc(p.title)}</strong><pre>${esc(p.content)}</pre>`).join('');el('chunks').innerHTML=current.chunks.map(c=>`<details><summary>块 ${c.ordinal+1} · 父单元 ${c.parent_id} · ${c.metadata.token_count} tokens · ${esc(c.embedding_status)}</summary><pre>${esc(c.embedding_text)}</pre><button onclick="act(()=>removeChunk(${c.id}))">删除此块</button><small>来源：${esc(JSON.stringify(c.metadata))}</small></details>`).join('');el('chunkTitle').textContent=`分块预览：${current.parents.length} 个父单元 / ${current.chunks.length} 个子块`;['step1','step2','step3'].forEach((s,i)=>el(s).className=i===(d.processing_config.preview_id?2:1)?'active':'')}
async function upload(){const f=el('file').files[0];if(!f)throw Error('请选择文件');const form=new FormData();form.append('file',f);form.append('knowledge_base',el('kb').value||'电力');const d=await api('/documents',{method:'POST',body:form});if(d.duplicate){await openDoc(d.id);alert('该文件已入库，已打开编辑草稿；确认前不会修改原版本。')}else await openDraft(d.draft_id);await refresh()}
async function preview(){await post(`/drafts/${current.draft_id}/preview`,{size:+el('size').value,overlap:+el('overlap').value});await openDraft(current.draft_id);await refresh()}
async function publish(){await post(`/drafts/${current.draft_id}/publish`,{preview_id:current.document.processing_config.preview_id});await openDraft(current.draft_id);await refresh()}
async function removeChunk(chunkId){if(!confirm('删除这段正文并重新切块？相邻块中的重叠内容也会移除；已发布版本在重新确认前保持不变。'))return;await api(`/drafts/${current.draft_id}/chunks/${chunkId}?preview_id=${encodeURIComponent(current.document.processing_config.preview_id)}`,{method:'DELETE'});await openDraft(current.draft_id);await refresh()}
async function discardDraft(){if(!confirm('放弃当前临时草稿？已入库内容不受影响。'))return;await api('/drafts/'+current.draft_id,{method:'DELETE'});current=null;el('editor').hidden=true;await refresh()}
async function remove(){if(!current.document.id)throw Error('尚未入库，请使用放弃草稿');if(!confirm('删除已入库文档及全部父子块？'))return;await api('/documents/'+current.document.id,{method:'DELETE'});await api('/drafts/'+current.draft_id,{method:'DELETE'});current=null;el('editor').hidden=true;await refresh()}
async function search(){const rows=await post('/search',{query:el('query').value,knowledge_base:el('kb').value,top_k:5});el('result').innerHTML=rows.length?rows.map(r=>`<article><strong>${esc(r.file_name)} · ${esc(r.title)}</strong><br><small>子块 ${r.chunk_id} → 父单元 ${r.parent_id} · 相似度 ${r.score.toFixed(3)}</small><p>命中片段</p><pre>${esc(r.matched_content)}</pre><details open><summary>父单元${r.parent_truncated?'（内容较长，仅展示前6000字符，可在文件详情查看全文）':''}</summary><pre>${esc(r.parent_content)}</pre></details></article>`).join(''):'暂无已入库的候选内容。'}
act(refresh);
</script></html>
